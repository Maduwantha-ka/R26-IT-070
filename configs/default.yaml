# configs/default.yaml
# Central config for ALAS-Net — R26-IT-070
# Edit values here, never hardcode them in scripts

data:
  image_size: 256
  num_classes: 10
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42
  raw_dir: data/raw/plantvillage
  split_dir: data/split

dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true

augmentation:
  use_cutmix: true
  use_elastic: true
  use_color_jitter: true
  horizontal_flip_prob: 0.5

backbone:
  name: efficientnet_b2
  pretrained: true
  out_channels: 1408
  feature_map_size: 8

lada:
  in_channels: 1408
  sla_kernel_size: 7
  dcg_hidden_dim: 256
  dropout: 0.1

training:
  epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  freeze_backbone_epochs: 0
  use_amp: true
  cutmix_alpha: 1.0
  checkpoint_dir: checkpoints

classes:
  Tomato___Bacterial_spot: 1702
  Tomato___Early_blight: 800
  Tomato___Late_blight: 1527
  Tomato___Leaf_Mold: 761
  Tomato___Septoria_leaf_spot: 1417
  Tomato___Spider_mites_Two-spotted_spider_mite: 1341
  Tomato___Target_Spot: 1123
  Tomato___Tomato_Yellow_Leaf_Curl_Virus: 4286
  Tomato___Tomato_mosaic_virus: 299
  Tomato___healthy: 1273